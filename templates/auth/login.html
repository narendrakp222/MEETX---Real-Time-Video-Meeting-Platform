<!DOCTYPE html>
<html>
<head>
<title>Login | MEETX</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, Arial, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#0f172a;
color:white;
}

/* LOGIN CARD */

.login-box{
width:380px;
background:#020617;
padding:40px;
border-radius:12px;
box-shadow:0 20px 40px rgba(0,0,0,0.4);
border:1px solid #1e293b;
text-align:center;
}

/* TITLE */

.login-box h2{
margin-bottom:25px;
font-size:28px;
color:#38bdf8;
}

/* INPUTS */

input{
width:100%;
padding:12px;
margin-bottom:15px;
border-radius:6px;
border:1px solid #1e293b;
background:#0f172a;
color:white;
font-size:15px;
}

input:focus{
outline:none;
border-color:#38bdf8;
}

/* BUTTON */

button{
width:100%;
padding:12px;
border:none;
border-radius:6px;
background:#38bdf8;
color:black;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:translateY(-2px);
box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

/* REGISTER LINK */

.register-link{
margin-top:18px;
display:block;
color:#38bdf8;
text-decoration:none;
}

.register-link:hover{
text-decoration:underline;
}

</style>

</head>

<body>

<div class="login-box">

<h2>Login to MEETX</h2>

<form action="/login" method="post">

<input type="email" name="email" placeholder="Email Address" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

<a class="register-link" href="/registerr">
Don't have an account? Register
</a>

</div>

</body>
</html>
